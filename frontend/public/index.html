        <!-- AGGRESSIVE CACHE BUSTING - Force fresh content on every load -->
        <script>
            // Version number - increment this after each deployment
            const APP_VERSION = 'v2.6.0';
            const BUILD_TIMESTAMP = '2025-12-25T10:00:00Z';
            
            // Skip version check on admin page to prevent losing auth state
            if (!window.location.pathname.includes('/admin')) {
                // Force hard reload if version changed
                const storedVersion = localStorage.getItem('azpay_app_version');
                const storedTimestamp = localStorage.getItem('azpay_build_timestamp');
                
                if (storedVersion !== APP_VERSION || storedTimestamp !== BUILD_TIMESTAMP) {
                    console.log('New version detected, clearing ALL cache...');
                    
                    // Clear EVERYTHING from localStorage (except admin-related)
                    const adminAuth = localStorage.getItem('admin_authenticated');
                    localStorage.clear();
                    if (adminAuth) localStorage.setItem('admin_authenticated', adminAuth);
                    
                    // Clear EVERYTHING from sessionStorage
                    sessionStorage.clear();
                    
                    // Clear IndexedDB if exists
                    if (window.indexedDB && window.indexedDB.databases) {
                        window.indexedDB.databases().then(dbs => {
                            dbs.forEach(db => window.indexedDB.deleteDatabase(db.name));
                        });
                    }
                    
                    // Store new version and timestamp
                    localStorage.setItem('azpay_app_version', APP_VERSION);
                    localStorage.setItem('azpay_build_timestamp', BUILD_TIMESTAMP);
                    
                    // Force SUPER hard reload to clear ALL caches
                    if (storedVersion || storedTimestamp) {
                        console.log('Performing SUPER hard reload...');
                        // Try to unregister any service workers
                        if ('serviceWorker' in navigator) {
                            navigator.serviceWorker.getRegistrations().then(registrations => {
                                registrations.forEach(registration => registration.unregister());
                            });
                        }
                        // Force reload with cache bypass
                        window.location.reload(true);
                    }
                }
            }
            
            // Auto-refresh detection - check for new version every 30 seconds
            // DISABLED ON ADMIN PAGE to prevent losing authentication state
            function checkForUpdates() {
                // Skip auto-refresh on admin page
                if (window.location.pathname.includes('/admin')) {
                    return;
                }
                
                fetch(window.location.href, {
                    method: 'HEAD',
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                }).then(response => {
                    const etag = response.headers.get('etag');
                    const storedEtag = sessionStorage.getItem('page_etag');
                    
                    if (storedEtag && etag && storedEtag !== etag) {
                        console.log('New deployment detected, reloading...');
                        window.location.reload(true);
                    } else if (!storedEtag && etag) {
                        sessionStorage.setItem('page_etag', etag);
                    }
                }).catch(() => {
                    // Silently fail - no network
                });
            }
            
            // Check for updates after page loads
            if (document.readyState === 'complete') {
                setTimeout(checkForUpdates, 30000);
            } else {
                window.addEventListener('load', () => {
                    setTimeout(checkForUpdates, 30000);
                });
            }
        </script>

        <!-- JavaScript to hide chat badges on mobile (optimized to not interfere with React) -->
        <script>
            // Hide chat launchers on mobile without interfering with React hydration
            function hideMobileLauncher() {
                if (window.innerWidth <= 768) {
                    // Hide Emergent badge
                    const lsButton = document.getElementById('ls-openButton');
                    if (lsButton) {
                        lsButton.style.setProperty('display', 'none', 'important');
                        lsButton.style.setProperty('visibility', 'hidden', 'important');
                    }
                    
                    // Hide SUPSIS launcher elements only (not all SUPSIS elements)
                    const supsisLauncherSelectors = [
                        '#supsis-launcher',
                        '#supsis-widget-launcher',
                        '.supsis-launcher'
                    ];
                    
                    supsisLauncherSelectors.forEach(selector => {
                        document.querySelectorAll(selector).forEach(el => {
                            el.style.setProperty('display', 'none', 'important');
                        });
                    });
                }
            }
            
            // Run only on key lifecycle events
            hideMobileLauncher();
            document.addEventListener('DOMContentLoaded', hideMobileLauncher);
            window.addEventListener('load', hideMobileLauncher);
            
            // Run once after React hydration (3 seconds delay)
            setTimeout(hideMobileLauncher, 3000);
